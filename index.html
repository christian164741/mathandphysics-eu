  <script>
  document.addEventListener('DOMContentLoaded', function () {
    var carousel = document.querySelector('.home-books-carousel');
    if (!carousel) return;

    var viewport = carousel.querySelector('.home-books-viewport');
    var track = carousel.querySelector('.home-books-track');
    var books = Array.from(track.querySelectorAll('.home-book-card'));
    var previousButton = carousel.querySelector('.home-carousel-arrow--previous');
    var nextButton = carousel.querySelector('.home-carousel-arrow--next');
    var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var pointerInteraction = false;
    var interactionPauseTimer;

    function maximumScroll() {
      return Math.max(0, viewport.scrollWidth - viewport.clientWidth);
    }

    function scrollStep() {
      if (!books.length) return viewport.clientWidth;
      var gap = parseFloat(window.getComputedStyle(track).gap) || 0;
      return books[0].getBoundingClientRect().width + gap;
    }

    function updateButtons() {
      var maximum = maximumScroll();
      previousButton.disabled = viewport.scrollLeft <= 1;
      nextButton.disabled = viewport.scrollLeft >= maximum - 1;
    }

    function move(direction, wrapAround) {
      var maximum = maximumScroll();
      if (maximum <= 1) return;

      var target = viewport.scrollLeft + direction * scrollStep();
      if (wrapAround && direction > 0 && viewport.scrollLeft >= maximum - 1) target = 0;
      if (wrapAround && direction < 0 && viewport.scrollLeft <= 1) target = maximum;

      viewport.scrollTo({
        left: Math.max(0, Math.min(maximum, target)),
        behavior: reducedMotion ? 'auto' : 'smooth'
      });
    }

    function autoplayPaused() {
      return document.hidden || carousel.matches(':hover') || carousel.contains(document.activeElement) || pointerInteraction;
    }

    function pauseAfterInteraction() {
      pointerInteraction = true;
      window.clearTimeout(interactionPauseTimer);
      interactionPauseTimer = window.setTimeout(function () {
        pointerInteraction = false;
      }, 8000);
    }

    previousButton.addEventListener('click', function () {
      pauseAfterInteraction();
      move(-1, false);
    });
    nextButton.addEventListener('click', function () {
      pauseAfterInteraction();
      move(1, false);
    });
    viewport.addEventListener('scroll', updateButtons, { passive: true });
    viewport.addEventListener('keydown', function (event) {
      if (event.key === 'ArrowLeft') {
        event.preventDefault();
        pauseAfterInteraction();
        move(-1, false);
      } else if (event.key === 'ArrowRight') {
        event.preventDefault();
        pauseAfterInteraction();
        move(1, false);
      }
    });
    carousel.addEventListener('pointerdown', pauseAfterInteraction);
    window.addEventListener('resize', updateButtons);

    if (!reducedMotion) {
      window.setInterval(function () {
        if (!autoplayPaused()) move(1, true);
      }, 6000);
    }

    updateButtons();
  });
  </script>

  <div id="counter"
       style="position:fixed;

    <!-- Filled by JavaScript -->

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    // An absolute path is more robust on subpages.
    fetch('/counter.php', { cache: 'no-store' })
      .then(function (response) {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.text();
      })
      .then(function (data) {
        var el = document.getElementById('counter');
        if (el) el.textContent = data;
      })
      .catch(function (err) {
        console.error('Counter error:', err);
        // Fallback display when the counter cannot be loaded.
        var el = document.getElementById('counter');
        if (el) el.textContent = '—';
      });
  });
  </script>
